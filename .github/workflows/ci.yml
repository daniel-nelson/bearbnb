# SECURITY-HARDENED CI generated by create-psychic.
#
# Hardening applied here (see SECURITY.md for the rationale):
#   - Least-privilege GITHUB_TOKEN: the `permissions:` block grants only
#     `contents: read`; every other scope defaults to none.
#   - Every action is pinned to an immutable commit SHA, not a mutable tag.
#   - Dependencies install with a frozen lockfile (no silent drift, and no
#     resolution of newly-published — possibly compromised — versions).
#
# The `env:`/`services:` values below are TEST-ONLY (an ephemeral CI database
# seeded with throwaway data). NEVER put production secrets in this file — use
# GitHub Actions encrypted secrets (`${{ secrets.NAME }}`) for anything real.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  uspec:
    name: Unit specs (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest splits spec FILES across these shards (one runner each). A new
        # app has too few spec files to split, so we default to one shard. As the
        # suite grows, parallelize via e.g. `shard: ["1/2", "2/2"]` (keep the
        # denominators equal).
        shard: ["1/1"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: bearbnb_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      TZ: UTC
      CI: "1"
      DB_USER: psychic
      DB_PASSWORD: postgres
      DB_NAME: bearbnb_test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NO_SSL: "1"
      REPLICA_DB_HOST: localhost
      REPLICA_DB_PORT: "5432"
      DREAM_PARALLEL_TESTS: "2"
      FIREBASE_PROJECT_ID: "demo-bearbnb"
      # TEST-ONLY throwaway encryption keys for the ephemeral CI database. Safe to
      # commit (they protect nothing real). Do NOT reuse these in any other env.
      APP_ENCRYPTION_KEY: "zci9Y4Yiwf32zVqBMm6ZRmTRobl2g99bNxCSLMRmOns="
      COLUMN_ENCRYPTION_KEY: "QnHhs50h+lz9S+7vhjUPyMVc0AbSmLhMqCeUYKfEi6U="
      # Required for browser-based feature specs: Psychic's CORS middleware reads this
      # to allow requests from the Vite dev servers. Must match CLIENT_APP_HOST,
      # ADMIN_APP_HOST, and INTERNAL_APP_HOST in .env.test.
      CORS_HOSTS: '["http://localhost:3050", "http://localhost:3051", "http://localhost:3052"]'
      CLIENT_APP_HOST: "http://localhost:3050"
      ADMIN_APP_HOST: "http://localhost:3051"
      INTERNAL_APP_HOST: "http://localhost:3052"
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm psy db:migrate --skip-sync
      - run: pnpm uspec --shard=${{ matrix.shard }}

  fspec:
    name: Feature specs (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest splits spec FILES across these shards (one runner each). A new
        # app has too few spec files to split, so we default to one shard. As the
        # suite grows, parallelize via e.g. `shard: ["1/2", "2/2"]` (keep the
        # denominators equal).
        shard: ["1/1"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: bearbnb_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      TZ: UTC
      CI: "1"
      DB_USER: psychic
      DB_PASSWORD: postgres
      DB_NAME: bearbnb_test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NO_SSL: "1"
      REPLICA_DB_HOST: localhost
      REPLICA_DB_PORT: "5432"
      DREAM_PARALLEL_TESTS: "2"
      FIREBASE_PROJECT_ID: "demo-bearbnb"
      # TEST-ONLY throwaway encryption keys for the ephemeral CI database. Safe to
      # commit (they protect nothing real). Do NOT reuse these in any other env.
      APP_ENCRYPTION_KEY: "zci9Y4Yiwf32zVqBMm6ZRmTRobl2g99bNxCSLMRmOns="
      COLUMN_ENCRYPTION_KEY: "QnHhs50h+lz9S+7vhjUPyMVc0AbSmLhMqCeUYKfEi6U="
      # Required for browser-based feature specs: Psychic's CORS middleware reads this
      # to allow requests from the Vite dev servers. Must match CLIENT_APP_HOST,
      # ADMIN_APP_HOST, and INTERNAL_APP_HOST in .env.test.
      CORS_HOSTS: '["http://localhost:3050", "http://localhost:3051", "http://localhost:3052"]'
      CLIENT_APP_HOST: "http://localhost:3050"
      ADMIN_APP_HOST: "http://localhost:3051"
      INTERNAL_APP_HOST: "http://localhost:3052"
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: install client packages
        run: pnpm install --frozen-lockfile
        working-directory: ./client
      - name: install admin packages
        run: pnpm install --frozen-lockfile
        working-directory: ./admin
      - name: install internal packages
        run: pnpm install --frozen-lockfile
        working-directory: ./internal
      - name: install puppeteer browser
        run: npx puppeteer browsers install firefox
      - run: mkdir -p /tmp/screenshots
      - run: pnpm psy db:migrate --skip-sync
      - run: pnpm fspec --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: feature-spec-screenshots-${{ matrix.shard }}
          path: /tmp/screenshots

  checks:
    name: Build, lint & API contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: bearbnb_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      TZ: UTC
      CI: "1"
      DB_USER: psychic
      DB_PASSWORD: postgres
      DB_NAME: bearbnb_test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NO_SSL: "1"
      REPLICA_DB_HOST: localhost
      REPLICA_DB_PORT: "5432"
      DREAM_PARALLEL_TESTS: "2"
      FIREBASE_PROJECT_ID: "demo-bearbnb"
      # TEST-ONLY throwaway encryption keys for the ephemeral CI database. Safe to
      # commit (they protect nothing real). Do NOT reuse these in any other env.
      APP_ENCRYPTION_KEY: "zci9Y4Yiwf32zVqBMm6ZRmTRobl2g99bNxCSLMRmOns="
      COLUMN_ENCRYPTION_KEY: "QnHhs50h+lz9S+7vhjUPyMVc0AbSmLhMqCeUYKfEi6U="
      # Required for browser-based feature specs: Psychic's CORS middleware reads this
      # to allow requests from the Vite dev servers. Must match CLIENT_APP_HOST,
      # ADMIN_APP_HOST, and INTERNAL_APP_HOST in .env.test.
      CORS_HOSTS: '["http://localhost:3050", "http://localhost:3051", "http://localhost:3052"]'
      CLIENT_APP_HOST: "http://localhost:3050"
      ADMIN_APP_HOST: "http://localhost:3051"
      INTERNAL_APP_HOST: "http://localhost:3052"
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
      - run: corepack enable
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'
      # oasdiff powers `psy diff:openapi`.
      - run: go install github.com/oasdiff/oasdiff@latest
      - run: pnpm install --frozen-lockfile
      # These are all fast, so chain them on one runner in order — keeps parallel
      # runners free for the long spec jobs above.
      - run: pnpm build:spec
      - run: pnpm lint
      # Reports OpenAPI contract changes vs. the base branch. Add `--fail-on-breaking`
      # (npm: append `-- --fail-on-breaking`) to make it a hard gate.
      - run: pnpm psy diff:openapi
      - run: pnpm psy check:controller-hierarchy
