services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      target: 'dev'
    command: sh -c "pnpm install && pnpm psy db:migrate --skip-sync && pnpm psy db:seed && pnpm web:dev"
    environment:
      # Certificates are checked. Behind a TLS-intercepting proxy, trust its CA with
      # NODE_EXTRA_CA_CERTS (the api's SECURITY.md shows how) instead of turning this off
      NODE_TLS_REJECT_UNAUTHORIZED: '${NODE_TLS_REJECT_UNAUTHORIZED:-1}'
      DB_HOST: db
      REPLICA_DB_HOST: db
      WS_REDIS_HOST: redis
      BG_JOBS_REDIS_HOST: redis
      NODE_ENV: '${NODE_ENV:-development}'
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - '7777:7777'
    working_dir: /usr/src/app
    volumes:
      - ./api:/usr/src/app:cached
      # The container's own node_modules, shared with ws and worker, so its install of Linux
      # builds of native packages (e.g. esbuild) never replaces the host's
      - api_node_modules:/usr/src/app/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 7777 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ws:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      target: 'dev'
    command: sh -c "pnpm ws:dev"
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: '${NODE_TLS_REJECT_UNAUTHORIZED:-1}'
      DB_HOST: db
      REPLICA_DB_HOST: db
      WS_REDIS_HOST: redis
      BG_JOBS_REDIS_HOST: redis
      NODE_ENV: '${NODE_ENV:-development}'
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - '8888:8888'
    working_dir: /usr/src/app
    volumes:
      - ./api:/usr/src/app:cached
      - api_node_modules:/usr/src/app/node_modules
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      target: 'dev'
    command: sh -c "pnpm worker:dev"
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: '${NODE_TLS_REJECT_UNAUTHORIZED:-1}'
      GITHUB_OAUTH_TOKEN: '${GITHUB_OAUTH_TOKEN}'
      BULLMQ_PRO_NPM_TOKEN: '${BULLMQ_PRO_NPM_TOKEN}'
      DB_HOST: db
      REPLICA_DB_HOST: db
      WS_REDIS_HOST: redis
      BG_JOBS_REDIS_HOST: redis
      NODE_ENV: '${NODE_ENV:-development}'
      DB_USER: postgres
      DB_PASSWORD: postgres
    working_dir: /usr/src/app
    volumes:
      - ./api:/usr/src/app:cached
      - api_node_modules:/usr/src/app/node_modules
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
      target: 'dev'
    user: '0'
    command: sh -c "pnpm install && pnpm dev --host 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: '${NODE_ENV:-development}'
      NODE_TLS_REJECT_UNAUTHORIZED: '${NODE_TLS_REJECT_UNAUTHORIZED:-1}'
    ports:
      - '3000:3000'
    working_dir: /usr/src/app
    volumes:
      - ./client:/usr/src/app:cached
      # Isolate container node_modules so Linux arm64-musl native deps (e.g. rollup) are used, not host's
      - client_node_modules:/usr/src/app/node_modules
    networks:
      - frontend
    depends_on:
      - api

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bearbnb_development
    user: postgres
    ports:
      - '7433:5432'
    volumes:
      # From 18 on, the image keeps its data under /var/lib/postgresql (in 18/docker), and
      # its entrypoint exits before initdb while a volume is mounted at the old .../data
      - db:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning
    ports:
      - '6380:6379'
    volumes:
      - redis:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 1s
      timeout: 3s
      retries: 5

volumes:
  db:
  redis:
  api_node_modules:
  client_node_modules:

networks:
  backend:
  frontend:
